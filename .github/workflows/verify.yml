name: Verify recorded benchmark

on: [push, pull_request]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Check Python syntax
        run: python -m py_compile kernel.py benchmark.py fetch_reference.py verify_results.py
      - name: Fetch and verify upstream reference
        run: python fetch_reference.py
      - name: Audit recorded measurements and source hashes
        run: python verify_results.py
